<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Pravesh Gold | Price Calculator</title>
    <!-- Core Engine -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="./styles.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body class="font-sans text-stone-900 flex flex-col items-center justify-start sm:justify-center p-4 min-h-screen"
    x-data="calculatorApp()" x-init="init()">

    <div class="rectangular-tab">
        <div class="maroon-header">
            <picture class="flex items-center justify-center">
                <source srcset="Logo.webp" type="image/webp">
                <img src="Logo.png" alt="Pravesh Gold Logo" width="2536" height="2533" fetchpriority="high" loading="eager" class="w-32 h-auto object-contain">
            </picture>
        </div>
        <p class="text-stone-400 text-[10px] font-black text-center uppercase tracking-widest mb-0.5">Auto Calculator
        </p>

        <div class="px-6 pb-4 space-y-4">

            <!-- Success State -->
            <template x-if="status === 'SUCCESS' && data">
                <div x-cloak class="space-y-2 pt-2">
                    <div class="flex flex-col items-center space-y-1">
                        <div
                            class="bg-stone-50 border border-stone-100 rounded-full py-1 px-6 shadow-sm flex flex-col items-center">
                            <p
                                class="text-stone-500 text-[8px] font-bold uppercase tracking-widest leading-none mb-0.5">
                                Rates Updated</p>
                            <p class="text-[10px] font-bold text-black leading-tight">
                                <span
                                    x-text="isNaN(new Date(data.date)) ? data.date : new Date(data.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })"></span>
                            </p>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="space-y-1">
                            <label class="block text-[10px] font-bold text-stone-700 ml-1">Select Karat</label>
                            <div class="relative" x-data="{ open: false, options: [{value: '22KT', label: '22KT'}, {value: '18KT', label: '18KT'}, {value: '24KT', label: '24KT (Gold Coins)'}, {value: 'SILVER', label: 'Silver (Coin)'}] }" @click.outside="open = false">
                                <button type="button" @click="open = !open" class="premium-input text-left flex justify-between items-center w-full focus:ring-4 focus:ring-maroon/10 focus:border-maroon">
                                    <span x-text="options.find(o => o.value === selectedKarat)?.label || 'Select Karat'"></span>
                                    <svg class="w-4 h-4 opacity-40 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
                                    </svg>
                                </button>
                                <div x-cloak x-show="open" 
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 translate-y-[-10px] scale-95"
                                     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave-end="opacity-0 translate-y-[-10px] scale-95"
                                     class="absolute z-50 w-full mt-2 bg-white border border-stone-100 rounded-xl shadow-xl overflow-hidden py-1">
                                    <template x-for="option in options" :key="option.value">
                                        <button type="button" 
                                                @click="selectedKarat = option.value; open = false" 
                                                class="w-full text-left px-4 py-2.5 text-[13.5px] font-semibold transition-colors duration-150 flex items-center justify-between"
                                                :class="selectedKarat === option.value ? 'bg-maroon/5 text-maroon' : 'text-stone-700 hover:bg-stone-50'">
                                            <span x-text="option.label"></span>
                                            <svg x-show="selectedKarat === option.value" class="w-4 h-4 text-maroon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div x-show="selectedKarat !== '24KT' && selectedKarat !== 'SILVER'" class="space-y-1">
                            <label class="block text-[10px] font-bold text-stone-700 ml-1">Weight (grams)</label>
                            <input type="text" inputmode="decimal" placeholder="e.g. 10.250" x-model="weight" class="premium-input">
                        </div>

                        <div x-show="selectedKarat !== '24KT' && selectedKarat !== 'SILVER'" class="space-y-1">
                            <label class="block text-[10px] font-bold text-stone-700 ml-1">Making Type</label>
                            <div class="relative" x-data="{ open: false }" @click.outside="open = false">
                                <button type="button" @click="open = !open" class="premium-input text-left flex justify-between items-center w-full focus:ring-4 focus:ring-maroon/10 focus:border-maroon">
                                    <span x-text="makingType"></span>
                                    <svg class="w-4 h-4 opacity-40 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
                                    </svg>
                                </button>
                                <div x-cloak x-show="open" 
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 translate-y-[-10px] scale-95"
                                     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave-end="opacity-0 translate-y-[-10px] scale-95"
                                     class="absolute z-50 w-full mt-2 bg-white border border-stone-100 rounded-xl shadow-xl overflow-hidden py-1">
                                    <template x-for="type in Object.keys(MAKING_RANGES)">
                                        <button type="button" 
                                                @click="makingType = type; open = false" 
                                                class="w-full text-left px-4 py-2.5 text-[13.5px] font-semibold transition-colors duration-150 flex items-center justify-between"
                                                :class="makingType === type ? 'bg-maroon/5 text-maroon' : 'text-stone-700 hover:bg-stone-50'">
                                            <span x-text="type"></span>
                                            <svg x-show="makingType === type" class="w-4 h-4 text-maroon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div x-show="selectedKarat === '24KT'" class="space-y-1.5">
                            <label class="block text-[10px] font-bold text-stone-700 ml-1">Coin Weight</label>
                            <div class="grid grid-cols-4 gap-2">
                                <template x-for="w in COIN_WEIGHTS">
                                    <button @click="coinWeight = w"
                                        :class="coinWeight === w ? 'bg-maroon border-maroon text-white scale-105 shadow-md' : 'bg-stone-50 border-stone-200 text-stone-600 hover:bg-stone-100 hover:border-stone-300'"
                                        class="py-2.5 rounded-xl border font-black text-[10px] transition-all duration-300 active:scale-95"
                                        x-text="w + 'g'"></button>
                                </template>
                            </div>
                        </div>

                        <div x-show="selectedKarat === 'SILVER'" class="space-y-1.5">
                            <label class="block text-[10px] font-bold text-stone-700 ml-1">Silver Coin Weight</label>
                            <div class="grid grid-cols-4 gap-2">
                                <template x-for="w in SILVER_WEIGHTS">
                                    <button @click="silverWeight = w"
                                        :class="silverWeight === w ? 'bg-maroon border-maroon text-white scale-105 shadow-md' : 'bg-stone-50 border-stone-200 text-stone-600 hover:bg-stone-100 hover:border-stone-300'"
                                        class="py-2.5 rounded-xl border font-black text-[10px] transition-all duration-300 active:scale-95"
                                        x-text="w + 'g'"></button>
                                </template>
                            </div>
                        </div>

                        <div class="pt-2 pb-6">
                            <div class="result-container space-y-0 shadow-sm">
                                <p class="text-stone-500 text-[9px] font-bold uppercase tracking-widest">Estimated Price
                                </p>
                                <template x-if="selectedKarat !== '24KT' && selectedKarat !== 'SILVER'">
                                    <h2 class="text-2xl font-black text-stone-900 transition-all duration-300 ease-out"
                                        x-text="jewelleryPriceString() || '...'"></h2>
                                </template>
                                <template x-if="selectedKarat === '24KT'">
                                    <h2 class="text-2xl font-black text-stone-900 transition-all duration-300 ease-out" x-text="coinPriceString()"></h2>
                                </template>
                                <template x-if="selectedKarat === 'SILVER'">
                                    <h2 class="text-2xl font-black text-stone-900 transition-all duration-300 ease-out" x-text="silverPriceString()"></h2>
                                </template>

                                <!-- WhatsApp CTA Button -->
                                <template x-if="getWhatsappUrl()">
                                    <div class="pt-4 animate-fade-in">
                                        <a :href="getWhatsappUrl()" target="_blank"
                                           class="w-full flex justify-center items-center gap-2 bg-gradient-to-r from-[#25D366] to-[#20B058] hover:from-[#20B058] hover:to-[#128C7E] text-white text-[12px] font-extrabold tracking-wide py-3.5 px-4 rounded-xl shadow-[0_4px_14px_0_rgba(37,211,102,0.39)] hover:shadow-[0_6px_20px_rgba(37,211,102,0.23)] transition-all duration-300 transform active:scale-95">
                                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                                            Send Quotation
                                        </a>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Error State -->
            <template x-if="status === 'ERROR'">
                <div class="py-12 flex flex-col items-center justify-center space-y-4 text-center">
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center text-red-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-stone-800 font-bold text-sm">Sync Failed</p>
                        <p class="text-stone-400 text-[10px] mt-1 px-4 leading-tight" x-text="errorMessage"></p>
                    </div>
                    <button @click="fetchRates()"
                        class="bg-maroon text-white px-8 py-3 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition-all">Retry
                        Live Sync</button>
                </div>
            </template>

            <!-- Loading State -->
            <template x-if="status === 'INITIALIZING'">
                <div class="w-full animate-pulse px-2 py-4">
                    <div class="flex justify-center mb-6">
                        <div class="h-6 w-32 bg-stone-200 rounded-full"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="space-y-2">
                            <div class="h-2.5 w-16 bg-stone-200 rounded ml-1"></div>
                            <div class="h-12 w-full bg-stone-100/80 rounded-[0.85rem]"></div>
                        </div>
                        <div class="space-y-2">
                            <div class="h-2.5 w-24 bg-stone-200 rounded ml-1"></div>
                            <div class="h-12 w-full bg-stone-100/80 rounded-[0.85rem]"></div>
                        </div>
                        <div class="space-y-2">
                            <div class="h-2.5 w-20 bg-stone-200 rounded ml-1"></div>
                            <div class="h-12 w-full bg-stone-100/80 rounded-[0.85rem]"></div>
                        </div>
                        <div class="pt-4 pb-2">
                            <div class="h-[104px] w-full bg-stone-200/70 rounded-[1.25rem] flex items-center justify-center">
                                <p class="text-stone-400/80 text-[10px] font-black uppercase tracking-widest">Establishing Live Sync...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <footer class="bg-stone-50 border-t border-stone-100 p-3 text-center rounded-b-[1.75rem]">
            <template x-if="selectedKarat !== '24KT' && selectedKarat !== 'SILVER'">
                <div class="text-[8.5px] font-bold text-stone-600 leading-tight space-y-1">
                    <p>Prices shown are approximate. Final billing will be done at the showroom.</p>
                    <p>3% taxes included in above calculation.</p>
                    <p class="text-maroon uppercase tracking-tighter pt-1">Pravesh Gold, Kalyan West.</p>
                </div>
            </template>
            <template x-if="selectedKarat === '24KT'">
                <div class="text-[8.5px] font-bold text-stone-600 leading-tight space-y-1">
                    <p>Prices shown are approximate. Final billing will be done at the showroom.</p>
                    <p>Gold coins include 3% taxes and making charges.</p>
                    <p class="text-maroon uppercase tracking-tighter pt-1">Pravesh Gold, Kalyan West.</p>
                </div>
            </template>
            <template x-if="selectedKarat === 'SILVER'">
                <div class="text-[8.5px] font-bold text-stone-600 leading-tight space-y-1">
                    <p>Prices shown are approximate. Final billing will be done at the showroom.</p>
                    <p>Silver coins include 3% taxes.</p>
                    <p class="text-maroon uppercase tracking-tighter pt-1">Pravesh Gold, Kalyan West.</p>
                </div>
            </template>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
