<body class="font-sans bg-[#fafafa] text-[#1c1917] antialiased"
    x-data="calculatorApp()" x-init="init()">

    <!-- Main Wrapper with Safe Areas for iPhones -->
    <div class="w-full min-h-screen flex flex-col items-center justify-start sm:justify-center p-3 sm:p-4 pb-[calc(1.5rem+env(safe-area-inset-bottom))] animate-fade-in">
        <div class="rectangular-tab">
        <div class="maroon-header relative overflow-hidden">
            <picture class="flex items-center justify-center">
                <source srcset="praveshgoldlogopng.webp" type="image/webp">
                <img src="praveshgoldlogopng.png" alt="Pravesh Gold Logo" fetchpriority="high" loading="eager" class="w-20 h-auto object-contain drop-shadow-[0_0_15px_rgba(212,175,55,0.3)]">
            </picture>
        </div>
        <p class="text-[#5c2e2e] text-[9px] font-black text-center uppercase tracking-[0.25em] mt-3 mb-1">PRAVESH GOLD LIVE CALCULATOR</p>

        <div class="px-5 pb-3 space-y-4">

            <!-- Success State -->
            <template x-if="status === 'SUCCESS' && data">
                <div x-cloak class="space-y-3 pt-0">
                    <div class="flex flex-col items-center space-y-1">
                        <div
                            class="bg-[#ffffff] border border-gray-200 rounded-full py-1 px-5 shadow-sm flex flex-col items-center backdrop-blur-md">
                            <p
                                class="text-stone-600 text-[8px] font-bold uppercase tracking-[0.2em] leading-none mb-1">
                                Rates Updated</p>
                            <p class="text-[10px] font-bold text-stone-900 leading-tight">
                                <span
                                    x-text="isNaN(new Date(data.date)) ? data.date : new Date(data.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })"></span>
                            </p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="space-y-1.5">
                            <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-[0.15em] ml-1.5">Select Karat</label>
                            <div class="relative" x-data="{ open: false, options: [{value: '22KT', label: '22KT Ornaments'}, {value: '18KT', label: '18KT Ornaments'}, {value: '24KT', label: '24KT Gold Coin'}, {value: '22KT_COIN', label: '22KT Gold Coin'}, {value: 'SILVER', label: 'Silver (Coin)'}] }" @click.outside="open = false">
                                <button type="button" @click="optHaptic(); open = !open" class="premium-input text-left flex justify-between items-center w-full py-3">
                                    <span x-text="options.find(o => o.value === selectedKarat)?.label || 'Select Karat'"></span>
                                    <svg class="w-4 h-4 text-stone-500 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
                                    </svg>
                                </button>
                                <div x-cloak x-show="open" 
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 translate-y-[-10px] scale-95"
                                     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave-end="opacity-0 translate-y-[-10px] scale-95"
                                     class="absolute z-50 w-full mt-2 bg-[#ffffff]/95 backdrop-blur-xl border border-gray-200 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.1)] overflow-hidden py-1">
                                    <template x-for="option in options" :key="option.value">
                                        <button type="button" 
                                                @click="optHaptic(); selectedKarat = option.value; open = false" 
                                                class="w-full text-left px-4 py-2 text-[13px] font-semibold transition-all duration-150 flex items-center justify-between"
                                                :class="selectedKarat === option.value ? 'bg-[#391111]/10 text-[#391111]' : 'text-stone-600 hover:bg-gray-100'">
                                            <span x-text="option.label"></span>
                                            <svg x-show="selectedKarat === option.value" class="w-4 h-4 text-[#391111]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div x-show="selectedKarat !== '24KT' && selectedKarat !== '22KT_COIN' && selectedKarat !== 'SILVER'" class="space-y-1.5" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95">
                            <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-[0.15em] ml-1.5">Weight (grams)</label>
                            <input type="text" inputmode="decimal" placeholder="e.g. 10.250" x-model="weight" class="premium-input py-3">
                        </div>

                        <div x-show="selectedKarat !== '24KT' && selectedKarat !== '22KT_COIN' && selectedKarat !== 'SILVER'" class="space-y-1.5" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95">
                            <div class="flex justify-between items-end ml-1.5 mb-1 mt-2">
                                <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-[0.15em]">Making Type</label>
                                <button type="button" @click="optHaptic(); showMakingGuide = true" class="text-[10px] font-black text-[#c29b27] hover:text-[#a07c1b] uppercase tracking-wider flex items-center gap-1 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Making Type Guide
                                </button>
                            </div>
                            <div class="relative" x-data="{ open: false }" @click.outside="open = false">
                                <button type="button" @click="optHaptic(); open = !open" class="premium-input text-left flex justify-between items-center w-full py-3">
                                    <span x-text="makingType"></span>
                                    <svg class="w-4 h-4 text-stone-500 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
                                    </svg>
                                </button>
                                <div x-cloak x-show="open" 
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 translate-y-[-10px] scale-95"
                                     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                                     x-transition:leave-end="opacity-0 translate-y-[-10px] scale-95"
                                     class="absolute z-50 w-full mt-2 bg-[#ffffff]/95 backdrop-blur-xl border border-gray-200 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.1)] overflow-hidden py-1">
                                    <template x-for="type in Object.keys(MAKING_RANGES)">
                                        <button type="button" 
                                                @click="optHaptic(); makingType = type; open = false" 
                                                class="w-full text-left px-4 py-2 text-[13px] font-semibold transition-all duration-150 flex items-center justify-between"

        status: 'INITIALIZING',

        optHaptic() {
            // Haptic vibration (mobile)
            if (typeof navigator !== 'undefined' && navigator.vibrate) {
                try { navigator.vibrate(20); } catch (e) {}
            }
            
            // Smooth, pleasant, soft UI "bloop" (no sharp clicking)

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    if (!window.audioCtx) window.audioCtx = new AudioContext();
                    const ctx = window.audioCtx;
                    if (ctx.state === 'suspended') ctx.resume();
                    
                    const osc = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    
                    osc.type = 'sine'; // Pure smooth tone
                    
                    // Very gentle pitch drop for a "bloop" or "droplet" effect
                    osc.frequency.setValueAtTime(500, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05); 
                    
                    // Smooth envelope to prevent any harsh clicking at the start
                    gainNode.gain.setValueAtTime(0, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.015); // Smooth fade in (no click)
                    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06); // Smooth fade out
                    
                    osc.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.07);
                }
            } catch (e) {}
        },

        init() {
            this.fetchRates();
            
            this.$watch('weight', (value) => {
                if (!value) return;
                
                // 1. Remove any non-numeric/non-decimal characters
                let clean = value.replace(/[^0-9.]/g, '');
                
                // 2. Prevent multiple decimals (e.g. "1.2.3" -> "1.23")
                const parts = clean.split('.');
                if (parts.length > 2) {
                    clean = parts[0] + '.' + parts.slice(1).join('');
                }
                
                // 3 & 4. Limit integer part to 3 digits (max 999), and decimal part to 3 digits
                if (clean.includes('.')) {
                    const [intPart, decPart] = clean.split('.');
                    clean = `${intPart.slice(0, 3)}.${decPart.slice(0, 3)}`;
                } else {
                    clean = clean.slice(0, 3);
                }
                
                // Update if changed
                if (value !== clean) {
                    this.weight = clean;
                }
            });
        },

        async fetchRates() {
            const CACHE_KEY = 'pg_rates_cache';
            const CACHE_TTL = 15 * 60 * 1000; // 15 minutes
            
            this.errorMessage = '';
            
            // 1. Try Cache First
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed.data && parsed.timestamp && (Date.now() - parsed.timestamp < CACHE_TTL)) {
                        this.data = parsed.data;
                        this.status = 'SUCCESS';
                        console.log('⚡ Loaded from Cache (Flash Fast)');
                        // Fetch in background to keep fresh without blocking UI
                        this.performLiveSync(CACHE_KEY).catch(() => {}); 
                        return;
                    }
                }
            } catch(e) {}

            // 2. No valid cache, show loading and fetch
            this.status = 'INITIALIZING';
            await this.performLiveSync(CACHE_KEY);
        },

        async performLiveSync(CACHE_KEY) {
            console.log('🚀 Sync Version: 2.3 - Production (Live Fetch)');

            const clean = (val) => {
                if (val === undefined || val === null) return 0;
                const n = parseFloat(val.toString().replace(/[^\d.]/g, ''));
                return isNaN(n) ? 0 : n;
            };

            try {
                const res = await fetch('/api/rates');
                if (!res.ok) throw new Error('API_OFFLINE');
                const body = await res.json();

                if (this.selectedKarat === 'SILVER' && (!body.rates || !body.rates.rate_silver)) {
                    throw new Error('SILVER_DATA_INCOMPLETE');
                }

                this.data = body;
                this.status = 'SUCCESS';
                localStorage.setItem(CACHE_KEY, JSON.stringify({ data: body, timestamp: Date.now() }));
                console.log('✅ Sync: API (Live)');
            } catch (err) {
                console.warn('⚠️ Sync Fallback:', err.message);
                try {
                    const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbxwLcOb1AeVbLdnaZ0OG6tncb91K5wCuneNk06fq_dQnAxlF4AYsbrq53mIGcO3lk27/exec';
                    const res = await fetch(GOOGLE_URL, { redirect: 'follow' });
                    const raw = await res.json();

                    let silverRate = clean(raw.rate_silver || raw.sheet_time);
                    let dateVal = raw.sheet_date;

                    if (silverRate > 1000000 && clean(dateVal) < 10000) {
                        silverRate = clean(dateVal);
                        dateVal = new Date().toISOString();
                    }

                    this.data = {
                        date: dateVal || new Date().toISOString(),
                        rates: {
                            rate_22k: clean(raw.rate_22k),
                            rate_24k: clean(raw.rate_24k),
                            rate_18k: clean(raw.rate_18k),
                            rate_silver: silverRate
                        }
                    };
                    
                    this.status = 'SUCCESS';
                    localStorage.setItem(CACHE_KEY, JSON.stringify({ data: this.data, timestamp: Date.now() }));
                    console.log('✅ Sync: Direct GSheet (Silver: ' + this.data.rates.rate_silver + ')');
                } catch (directErr) {
                    console.error('❌ Sync Failed:', directErr);
                    // Only show error if we don't already have cached data showing
                    if (this.status !== 'SUCCESS') {
                        this.errorMessage = "Sync Failed. Please check internet.";
                        this.status = 'ERROR';
                    }
                }
            }
        },

        formatCurrency(val) {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Math.round(val));
        },

        jewelleryPriceString() {
            if (!this.data || !this.weight) return null;
            let val = String(this.weight).replace(/,/g, '.').trim();
            if (val === '.' || val === '-' || val === '') return null;
            const w = parseFloat(val);
            if (isNaN(w) || w <= 0) return null;
            const r = this.selectedKarat === '18KT' ? this.data.rates.rate_18k : this.data.rates.rate_22k;
            const making = MAKING_RANGES[this.makingType];
            const low = (r + (r * making.min)) * w * (1 + GST_RATE);
            const high = (r + (r * making.max)) * w * (1 + GST_RATE);
            return isNaN(low) ? '...' : this.formatCurrency(low) + ' – ' + this.formatCurrency(high);
        },

        coinPriceString() {
            if (!this.data || !this.data.rates.rate_24k) return '...';
            const b = this.coinWeight * this.data.rates.rate_24k;
            const f = (b + (b * COIN_MAKING_RATE)) * (1 + GST_RATE);
            return isNaN(f) ? '...' : this.formatCurrency(f);
        },

        coin22KBreakup() {
            if (!this.data || !this.data.rates.rate_22k) return null;
            const b = this.coinWeight * this.data.rates.rate_22k;
            const making = b * COIN_MAKING_RATE;
            const gst = (b + making) * GST_RATE;
            const total = b + making + gst;
            if (isNaN(total)) return null;
            return {
                goldValue: this.formatCurrency(b),
                making: this.formatCurrency(making),
                gst: this.formatCurrency(gst),
                total: this.formatCurrency(total)
            };
        },

        silverPriceString() {
            const r = this.data?.rates?.rate_silver;
            if (!r) return '...';
            const b = this.silverWeight * r;
            const f = b * (1 + GST_RATE);
            return isNaN(f) ? '...' : this.formatCurrency(f);
        },

        getWhatsappUrl(message = '') {
            let price = '';
            let details = '';
            
            if (this.selectedKarat === '24KT') {
                price = this.coinPriceString();
                if (price === '...' || !price) return null;
                details = `Item: 24KT Gold Coin\nWeight: ${this.coinWeight}g`;
            } else if (this.selectedKarat === '22KT_COIN') {
                const b = this.coin22KBreakup();
                if (!b) return null;
                price = b.total;
                details = `Item: 22KT Gold Coin\nWeight: ${this.coinWeight}g`;
            } else if (this.selectedKarat === 'SILVER') {
                price = this.silverPriceString();
                if (price === '...' || !price) return null;
                details = `Item: Silver Coin\nWeight: ${this.silverWeight}g`;
            } else {
                price = this.jewelleryPriceString();
                if (price === '...' || !price) return null;
                details = `Karat: ${this.selectedKarat}\nWeight: ${this.weight}g\nMaking Type: ${this.makingType}`;
            }

            let text = message;
            return `https://wa.me/918291679495${text ? '?text=' + encodeURIComponent(text) : ''}`;
        },

        getFailureWhatsappUrl() {
            const text = "Hi Pravesh Gold Team,\n\nCalculator par live gold rate load nahi ho raha hai.\n\nPlease mujhe today’s gold rate aur jewellery quotation details share kijiye.";
            return `https://wa.me/918291679495?text=${encodeURIComponent(text)}`;
        }
    }
}

// Basic deterrent for casual inspection
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('keydown', function (e) {
    if (e.key === 'F12' || 
       (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
       (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
    }
});
